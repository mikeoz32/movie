[project]
name = "movie-actor-runtime"
version = "0.1.0"
description = "A bounded actor runtime for free-threaded CPython"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mikeoz32/movie"
Repository = "https://github.com/mikeoz32/movie.git"
Issues = "https://github.com/mikeoz32/movie/issues"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["movie"]

[tool.hatch.build.targets.wheel.force-include]
"movie.toml.example" = "movie/movie.toml.example"

[dependency-groups]
test = [
    "pytest>=8.4.2",
    "pytest-cov>=6.2.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.12.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--timeout=30"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
